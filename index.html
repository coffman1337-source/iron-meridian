<title>IRON MERIDIAN — Real-Time Command</title>
<!--
  IRON MERIDIAN — an ORIGINAL real-time grand-strategy game.
  Single self-contained offline file: no network, no external assets, no fonts,
  no microtransactions. All art (map, emblems, unit icons) is procedural.
  Nations, units, map and UI are invented for this game.
-->
<style>
:root{
  --bg:#05080d; --panel:rgba(10,16,24,.86); --panel2:rgba(16,24,36,.92); --line:rgba(120,170,220,.16); --line2:rgba(120,170,220,.3);
  --tx:#dbe6f2; --dim:#7f93a8; --acc:#3d8bfd; --good:#35d39a; --bad:#ff5468; --warn:#ffb547;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:13px/1.4 var(--font);user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;display:block;cursor:default}
#map.drag{cursor:grabbing}
/* subtle CRT/war-room overlay */
#scan{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);z-index:1}
.glass{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04)}
/* ---------- top command bar ---------- */
#top{position:fixed;left:12px;right:12px;top:10px;height:56px;border-radius:14px;display:flex;align-items:center;gap:14px;padding:0 14px;z-index:5}
#brand{display:flex;align-items:center;gap:10px;min-width:210px}
#brand canvas{width:34px;height:34px}
#brand .n{font-weight:800;letter-spacing:.14em;font-size:12px}
#brand .s{font-size:10px;color:var(--dim);letter-spacing:.2em}
.sep{width:1px;height:30px;background:var(--line)}
.res{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid transparent;min-width:118px}
.res svg{width:20px;height:20px;flex:none}
.res .v{font:700 15px var(--mono);letter-spacing:-.02em}
.res .i{font:11px var(--mono);color:var(--good)} .res .i.neg{color:var(--bad)}
.res .l{font-size:9px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
.res.low{border-color:rgba(255,84,104,.5);animation:lowp 1s infinite}
@keyframes lowp{50%{background:rgba(255,84,104,.12)}}
#clock{margin-left:auto;text-align:right}
#clock .d{font:700 18px var(--mono);letter-spacing:.04em}
#clock .h{font-size:10px;color:var(--dim);letter-spacing:.2em}
#speed{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
#speed button{border:0;background:transparent;width:38px;height:30px;border-radius:7px;font:700 12px var(--mono);color:var(--dim);transition:.15s}
#speed button:hover{color:var(--tx);background:rgba(255,255,255,.06)}
#speed button.on{background:var(--acc);color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--acc) 60%,transparent)}
#speed button.pz.on{background:var(--warn);color:#111;box-shadow:0 0 16px rgba(255,181,71,.5)}
.tb{border:1px solid var(--line);background:rgba(255,255,255,.03);height:32px;padding:0 11px;border-radius:9px;color:var(--dim);font-size:12px;font-weight:600;letter-spacing:.04em;transition:.15s}
.tb:hover{color:var(--tx);border-color:var(--line2);background:rgba(255,255,255,.07)}
.tb.on{color:var(--tx);border-color:var(--acc)}
#paused{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:4;padding:5px 16px;border-radius:20px;font:700 11px var(--mono);letter-spacing:.3em;color:#111;background:var(--warn);display:none;box-shadow:0 0 24px rgba(255,181,71,.4)}
/* ---------- side panel ---------- */
#side{position:fixed;right:12px;top:76px;bottom:132px;width:360px;border-radius:14px;z-index:5;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#side.col{transform:translateX(calc(100% + 14px))}
#sidetog{position:fixed;right:380px;top:86px;z-index:6;width:26px;height:44px;border-radius:8px 0 0 8px;border:1px solid var(--line);border-right:0;background:var(--panel);color:var(--dim);transition:right .3s cubic-bezier(.2,.8,.2,1)}
#sidetog.col{right:12px}
#tabs{display:flex;padding:8px 8px 0;gap:4px}
#tabs button{flex:1;border:0;background:transparent;padding:8px 0 9px;border-radius:9px 9px 0 0;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.12em;position:relative}
#tabs button.on{color:var(--tx);background:rgba(255,255,255,.04)}
#tabs button.on:after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#panel{flex:1;overflow:auto;padding:12px 14px 16px;border-top:1px solid var(--line)}
#panel::-webkit-scrollbar{width:8px}#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:4px}
h2{margin:0 0 2px;font-size:17px;letter-spacing:.02em}
h3{margin:16px 0 8px;font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;display:flex;align-items:center;gap:8px}
h3:after{content:"";flex:1;height:1px;background:var(--line)}
.sub{color:var(--dim);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:#b9c8d8}
.urow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;border:1px solid transparent;margin-bottom:4px;background:rgba(255,255,255,.025);cursor:pointer;transition:.12s}
.urow:hover{background:rgba(255,255,255,.06)}
.urow.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.urow img{width:30px;height:22px}
.urow .nm{flex:1;font-weight:600;font-size:12px}
.urow .ct{font:700 12px var(--mono);color:var(--dim)}
.hpb{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:3px}
.hpb i{display:block;height:100%;background:linear-gradient(90deg,#35d39a,#7cf2c4);border-radius:3px}
.pb{height:6px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:5px}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#9fd0ff);box-shadow:0 0 10px var(--acc);transition:width .25s linear}
.btn{border:1px solid var(--line2);background:rgba(255,255,255,.04);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:600;transition:.12s}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff}
.btn.danger{border-color:rgba(255,84,104,.5);color:#ffb3bd}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.025);margin-bottom:6px;cursor:pointer;transition:.12s;position:relative}
.card:hover{border-color:var(--line2);background:rgba(255,255,255,.06);transform:translateX(-2px)}
.card.dis{opacity:.38;cursor:not-allowed;transform:none}
.card img{width:40px;height:30px}
.card .t{font-weight:700;font-size:12px}
.card .c{font:11px var(--mono);color:var(--dim)}
.card .st{font:10px var(--mono);color:#9fb3c8;margin-top:2px}
.card.done{border-color:rgba(53,211,154,.4)}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.q{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25);margin-bottom:4px}
.q img{width:26px;height:20px}
.q .x{margin-left:auto;border:0;background:transparent;color:var(--dim);font-size:14px}
.q .x:hover{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}
.kv b{font:600 12px var(--mono);text-align:right}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.c-good{color:var(--good)}.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-acc{color:#9fd0ff}
/* ---------- bottom ticker ---------- */
#ticker{position:fixed;left:236px;right:384px;bottom:12px;height:108px;border-radius:14px;z-index:5;display:flex;flex-direction:column;overflow:hidden;transition:right .3s}
#ticker.wide{right:12px}
#ticker .hd{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.2em;color:var(--dim)}
#ticker .hd .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#log{flex:1;overflow:auto;padding:4px 12px 6px;font-size:12px}
#log::-webkit-scrollbar{width:6px}#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08)}
.le{padding:2px 0;display:flex;gap:10px;animation:lein .35s ease-out}
@keyframes lein{from{opacity:0;transform:translateY(6px)}}
.le .tm{font:11px var(--mono);color:#5d7186;flex:none;width:86px}
/* ---------- minimap ---------- */
#mini{position:fixed;left:12px;bottom:12px;width:212px;height:140px;border-radius:14px;z-index:5;padding:6px;overflow:hidden}
#mini canvas{width:100%;height:100%;border-radius:9px;cursor:pointer;display:block}
#hint{position:fixed;left:12px;bottom:160px;z-index:4;font-size:11px;color:var(--dim);line-height:1.7;padding:8px 11px;border-radius:12px;max-width:212px}
kbd{font:600 10px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--tx)}
/* ---------- toasts / tooltip ---------- */
#toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:9px 16px 9px 12px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;animation:tin .4s cubic-bezier(.2,.9,.3,1.3);border-left:3px solid var(--acc)}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.toast .ic{font-size:16px}
.toast.out{animation:tout .4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#tip{position:fixed;z-index:9;pointer-events:none;padding:8px 11px;border-radius:10px;font-size:12px;display:none;max-width:260px}
#tip b{font-size:13px}
/* ---------- modals ---------- */
#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,14,24,.7),rgba(2,4,8,.94));backdrop-filter:blur(4px)}
.mbox{width:min(880px,94vw);max-height:92vh;overflow:auto;border-radius:20px;padding:28px 32px;animation:tin .5s}
.title{font-size:34px;font-weight:900;letter-spacing:.22em;margin:0;background:linear-gradient(90deg,#fff,#9fd0ff 60%,#3d8bfd);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--dim);letter-spacing:.3em;font-size:11px;margin:4px 0 20px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fcard{border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02);transition:.18s;position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-3px);border-color:var(--line2)}
.fcard.on{border-color:var(--fc);box-shadow:0 0 0 1px var(--fc) inset,0 10px 30px color-mix(in srgb,var(--fc) 25%,transparent);background:color-mix(in srgb,var(--fc) 9%,transparent)}
.fcard canvas{width:64px;height:64px}
.fcard .fn{font-weight:800;font-size:13px;margin-top:6px}
.fcard .fd{font-size:11px;color:var(--dim);margin-top:4px;min-height:44px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:7px;color:var(--dim);font-weight:700;font-size:12px}
.seg button.on{background:rgba(255,255,255,.1);color:var(--tx)}
.lab{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:6px;text-transform:uppercase}
.go{margin-top:24px;display:flex;gap:10px;justify-content:flex-end}
.go .btn{padding:11px 20px;font-size:13px}
.big{font-size:44px;font-weight:900;letter-spacing:.2em;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font:800 22px var(--mono)}
.stat span{font-size:10px;color:var(--dim);letter-spacing:.16em}
.pickbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pickbar .seg button{font-size:11px;padding:5px 8px}
#csearch{flex:1;min-width:180px;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:10px;color:#fff;padding:8px 12px;font:inherit;font-size:13px;outline:none}
.pickwrap{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;height:min(46vh,430px)}
.clist{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;align-content:start;padding-right:4px}
.ccard{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 8px;cursor:pointer;background:rgba(255,255,255,.02);transition:.12s}
.ccard:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}.ccard.on{border-color:var(--fc);box-shadow:0 0 0 1px var(--fc) inset;background:color-mix(in srgb,var(--fc) 12%,transparent)}
.ccard canvas{width:36px;height:36px;flex:none}.ccard .cn{flex:1;min-width:0;display:flex;flex-direction:column}.ccard .cn b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ccard .cn span{font-size:10px;color:var(--dim)}
.ccard .cs{display:flex;flex-direction:column;gap:3px;font-size:9px;color:var(--dim)}.pbar{display:inline-block;width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);vertical-align:middle;overflow:hidden}.pbar i{display:block;height:100%}
.cdetail{padding:12px;border-radius:12px;overflow-y:auto}.kits{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.kit{font-size:11px;padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.kit.t3{border-color:#7fd1ff;color:#cdeeff}.kit.t1{color:#b9c2cc}.kit.no{opacity:.45;text-decoration:line-through}
.dfil{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 8px}.dfil button{font-size:11px;padding:4px 8px}

#map{touch-action:none}
button,.ccard,[data-act],[data-pick]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

}

 ["Andaman Sea",96,10],["Bay of Bengal",88,14],["Arabian Sea",64,16],["Indian Ocean",80,-15],["Southern Indian Ocean",90,-40],["Mozambique Channel",41,-18],["Gulf of Aden",48,12],["Red Sea",38,20],
 ["Persian Gulf",51,27],["Caspian Sea",50,42],["Black Sea",34,43],["Aegean Sea",25,38],["Eastern Mediterranean",30,33],["Central Mediterranean",17,36],["Western Mediterranean",4,39],

 ["Timor Sea",126,-12],["Arafura Sea",136,-9],["Scotia Sea",-50,-52],["Drake Passage",-68,-56],["Strait of Malacca",100,3],["Somali Basin",55,0],["Southern Ocean",20,-50]];

function generateWorld(){

  { const seen=new Uint8Array(N); for(let i=0;i<N;i++) if(code[i]&&!seen[i]){ const comp=[i]; seen[i]=1; for(let h=0;h<comp.length;h++) for(const j of nb(comp[h])) if(code[j]&&!seen[j]){seen[j]=1;comp.push(j);}

  for(const c of cand){ if(near(c,FILL_SP)) continue; const k=code[c]; const C=COUNTRIES.find(x=>R.codes.indexOf(x.a3)+1===k); addSeed(c,{name:null,ctry:C?C.id:-1,city:0}); }
  // every same-country land component needs a seed
  { const seen=new Uint8Array(N); for(let i=0;i<N;i++) if(land(i)&&!seen[i]){ const comp=[i]; seen[i]=1; for(let h=0;h<comp.length;h++) for(const j of nb(comp[h])) if(code[j]===code[i]&&!seen[j]){seen[j]=1;comp.push(j);}
      if(comp.some(c=>taken[c]>=0)||comp.length<10) continue; let cx=0,cy=0; comp.forEach(c=>{cx+=c%W;cy+=(c/W)|0;}); cx/=comp.length; cy/=comp.length; let best=comp[0],bd=1e9; for(const c of comp){ const d=(c%W-cx)**2+(((c/W)|0)-cy)**2; if(d<bd){bd=d;best=c;} }
      const C=COUNTRIES.find(x=>R.codes.indexOf(x.a3)+1===code[i]); addSeed(best,{name:null,ctry:C?C.id:-1,city:0}); } }
  const nLand=seeds.length;
  // sea seeds
  const distLand=new Int32Array(N).fill(1e9); { const q=[]; for(let i=0;i<N;i++) if(land(i)){distLand[i]=0;q.push(i);} let h=0; while(h<q.length){const c=q[h++];for(const j of nb(c)) if(distLand[j]>distLand[c]+1){distLand[j]=distLand[c]+1;q.push(j);}} }
  const seaC=[]; for(let i=0;i<N;i++) if(!land(i)) seaC.push(i); shuffle(seaC); seaC.sort((a,b)=>distLand[a]-distLand[b]>0?1:-1);
  const seaSeeds=[]; for(const c of seaC){ if(distLand[c]<2) continue; const sp=distLand[c]<7?12:22; const x=c%W,y=(c/W)|0; let ok=true; for(const s of seaSeeds){ const dx=s%W-x,dy=((s/W)|0)-y; if(dx*dx+dy*dy<sp*sp){ok=false;break;} } if(ok) seaSeeds.push(c); }

  const cell=new Int16Array(N).fill(-1), jit=makeNoise(W,H,3), heap=new Heap(), cost=new Float64Array(N).fill(1e9);
  seeds.forEach((s,k)=>{cell[s.c]=k;cost[s.c]=0;heap.push(0,s.c);});
  while(heap.size){ const [k,c]=heap.pop(); if(k>cost[c])continue; for(const j of nb(c)){ if(code[j]!==code[c])continue; const nk=k+1+jit(j%W,(j/W)|0)*1.4; if(nk<cost[j]){cost[j]=nk;cell[j]=cell[c];heap.push(nk,j);} } }

  const bestD=provs.map(()=>1e9);

  provs.forEach((p,k)=>{ const s=seeds[k]; if(s.name&&!p.sea){ p.lx=s.c%W; p.ly=(s.c/W)|0; } });
  // names: filler land = compass + country; sea = nearest named sea
  const used={}; const uniq=(n,alt)=>{ if(!used[n]){used[n]=1;return n;} if(alt&&!used[alt]){used[alt]=1;return alt;} used[n]++; return n+" "+used[n]; };

}

/* =====================================================================
   SECTION 4 — GAME STATE
   All units live in G.units. Each frame-step an index of *stationed* units
   per province (IDX) is rebuilt; units with a `seg` are in transit.
   ===================================================================== */
let G = null;               // full serialisable game state
let IDX = [];               // IDX[pid] = stationed units in province
let HOPS = [];              // HOPS[a][b] = adjacency hop distance (any medium)
let LHOPS = [];             // LHOPS[a][b] = hop distance over land only
const UI = { sel:null, selUnits:new Set(), tab:"prov", hover:null, speed:2, prevSpeed:2, fog:false, buildAt:null, collapsed:false };

function P(id){ return G.provs[id]; }
function F(id){ return G.factions[id]; }
function U(pid){ return IDX[pid]||[]; }
function hasTech(fid,t){ return fid>=0 && !!G.factions[fid].tech.done[t]; }
function newUnit(type,owner,loc){ const u={id:G.uid++,type,owner,hp:0,loc,seg:null,path:[],order:null,spdCap:0,retreat:false,ready:0,tg:0}; u.hp=maxHp(u); G.units.push(u); return u; }
function maxHp(u){ return UNITS[u.type].hp + (u.type==="armor"&&hasTech(u.owner,"composite")?4:0); }
function stat(u,k){ const d=UNITS[u.type]; let v=d[k]; if(k==="atk"||k==="def") v*=(u.tm??(u.tm=TIER_STAT[tierOf(u.owner,u.type)]));
  if(k==="def"){ if(u.type==="armor"&&hasTech(u.owner,"composite"))v+=2; if(u.type==="aa"&&hasTech(u.owner,"iads"))v+=3; }

  { const c=bestZone.counts, fair=c.reduce((x,y)=>x+y,0)/c.length; G.fair.maxRatio=Math.max(...c)/fair; G.fair.minRatio=Math.min(...c)/fair;

  caps.forEach((_,zi)=>{ const fid=capsBy.indexOf(zi), pid=caps[zi], f=F(fid), p=P(pid); f.capital=pid; p.capitalOf=fid; p.owner=fid; p.city=3; p.terrain="urban"; });

  });

function computeIncome(fid){
  const f=F(fid); const inc={c:0,f:0,m:0};
  for(const p of G.provs){ if(p.sea||p.owner!==fid)continue; const k=occFactor(p);
    inc.c+=(6+p.city*10+(p.capitalOf===fid?20:0))*k;
    inc.f+=((p.oil?7:0)+(p.city>=2?2:0)+(hasTech(fid,"synfuel")&&p.city?3:0))*k;
    inc.m+=(1+p.city)*k; }

  const rk=rallyK(fid); inc.c+=RALLY_INCOME*rk; inc.m+=4*rk;
  if(f.ek){ inc.c*=f.ek; inc.m*=f.ek; }
  if(hasTech(fid,"industry")) inc.c*=1.25;
  if(hasTech(fid,"synfuel")) inc.f*=1.5;
  if(hasTech(fid,"conscript")) inc.m*=1.5;
  if(fid>0){ const m=DIFF[G.diff].income; inc.c*=m; inc.f*=m; inc.m*=m; }
  const up={c:0,f:0}; for(const u of G.units) if(u.owner===fid){ up.c+=UNITS[u.type].up.c; up.f+=UNITS[u.type].up.f; }
  return {c:inc.c-up.c, f:inc.f-up.f, m:inc.m, gross:{c:inc.c,f:inc.f}, up};
}
function economyStep(dt){

    if(f.res.f<0){ f.res.f=0; if(!f.noFuel){ f.noFuel=true; if(f.id===0){ log("FUEL EXHAUSTED — armor, aircraft and ships slowed to a crawl!","bad"); toast("Fuel exhausted","bad","⛽"); } } }
    else if(f.noFuel&&f.res.f>8) f.noFuel=false;

function rebuildBorders(){ const n=nF(); BORDER=Array.from({length:n},()=>new Array(n).fill(false));

function crushing(b){ for(const e of enemiesOf(b)){ const w=G.dip.wars[dipKey(b,e)]; if(w&&w.sz[e]>=3&&(w.sz[e]-natSize(e))/w.sz[e]>=CRUSH_SHARE&&natSize(b)>w.sz[b]) return e; } return -1; }
function borderNeutral(a){ for(const p of G.provs){ if(p.sea||p.owner!==a) continue; for(const q of p.adj){ const Q=P(q); if(!Q.sea&&Q.owner<0) return true; } } return false; }
const SMALL_FIELD = 3;           // with this many powers or fewer, the strongest one is a shared threat

function aiEvalOffer(b,a,kind){ // would AI nation b accept `kind` from a?

// ---- AI strategic think (called on its own timer from the sim loop) ----
function aiDiplomacy(a){

    if(b===0&&humanDip()){ pushOffer(a,0,kind); G.dip.cool[a][b]=G.dip.cool[b][a]=G.time+OFFER_COOLDOWN_H; return true; }
    const r=aiEvalOffer(b,a,kind); if(!r.ok&&rand()<0.7){ G.dip.cool[a][b]=G.dip.cool[b][a]=G.time+12; return false; } // sounded out informally

      const fear=natPower(b)>natPower(a)*(1.15-pe.caution*0.2), busy=warsOf(a)>0;

    for(const e of others){ if(!reach(a,e)||atWar(a,e)||dipState(a,e)!=="peace"||G.dip.truce[a][e]>G.time) continue; const en=enemiesOf(e); if(!en.length||en.length>JOIN_MAX_ENEMIES) continue;
      const friend=en.find(x=>rel(a,x)>=15||isAlly(a,x)); if(friend==null||rel(a,e)>-10) continue;

  // 5) offensive war against the best target
  const maxWars=pe.aggr>0.65&&f.weary<20?2:1; if(warsOf(a)>=maxWars||f.weary>35||G.time/24<EARLY_PEACE_DAYS) return;

// ---- periodic bookkeeping ----
function diploHourly(){

function revoltStep(){ // occupied land of a small nation at peace with its occupier may rise and return home

function noteLoss(t,by){ if(t.owner<0) return; const f=F(t.owner); f.weary=clamp(f.weary+WEARY_PER_UNIT*Math.max(0.4,(UNITS[t.type].cost.c||20)/50),0,100);

function noteProvLost(prev,by){ if(prev<0) return; F(prev).weary=clamp(F(prev).weary+WEARY_PER_PROV,0,100); if(by>=0) F(by).weary=clamp(F(by).weary+WEARY_OCCUPY,0,100); }

/* =====================================================================
   SECTION 6 — ORDERS & PATHING
   Dijkstra over the province graph weighted by travel distance × terrain
   cost. Ground units walk land (or crawl across sea with Amphibious
   Doctrine), ships sail sea zones, aircraft/missiles fly direct.
   A unit's `path` is the list of provinces still to enter; its `seg` is the

function domainOf(u){ return isFlyer(u)?"air":isSea(u)?"sea":"land"; }
function stepCost(from,to,dom,owner){ const q=P(to); let c=provDist(from,to);
  if(dom==="land"){ if(q.sea) c*=2.6; else c*=TERRAIN[q.terrain].mvc; }
  return c; }
function passable(pid,dom,owner){ const p=P(pid);
  if(dom==="sea") return p.sea;
  if(dom==="land") return p.sea ? (hasTech(owner,"amphib") && !hostileUnits(owner,pid).some(isSea)) : canEnter(owner,p.owner,p);
  return true; }
function findPath(src,dst,dom,owner){

  const n=G.provs.length, dist=new Float64Array(n).fill(1e18), prev=new Int32Array(n).fill(-1), heap=new Heap();
  dist[src]=0; heap.push(0,src);
  while(heap.size){ const [d,c]=heap.pop(); if(d>dist[c]) continue; if(c===dst) break;
    for(const a of P(c).adj){ if(!passable(a,dom,owner)) continue;
      // amphibious crossings: no sea->sea chains longer than one zone

function unitSpeed(u){ let s=UNITS[u.type].spd; if(u.spdCap>0) s=Math.min(s,u.spdCap);

function hopTime(u,from,to){ return stepCost(from,to,domainOf(u),u.owner)/unitSpeed(u); }
function unitPos(u){ // current location as province id (current hop's origin when moving)

function pathEnd(u){ return u.path.length?u.path[u.path.length-1]:(u.seg?u.seg.to:u.loc); }

function seaDestFor(pid,from,owner){ const p=P(pid); if(p.sea) return pid; let best=null,bd=1e9;

/* Issue orders from the UI / AI. Returns {n, kind} summary.
   - flyers: sortie (strike) when target holds enemies within range, else rebase to own province
   - artillery / frigates: bombard enemy target in range from current position
   - otherwise move along a path (queue=true appends from current path end) */
function issueOrder(units,dst,queue,forceMove){
  const res={moved:0,strike:0,bombard:0,fail:0}; const q=P(dst);
  units=units.filter(alive); if(!units.length) return res;
  const owner=units[0].owner;
  const enemyAt=G.units.some(x=>atWar(x.owner,owner)&&x.loc===dst&&!x.seg);
  const groups=new Map(); // group by domain for shared paths + speed cap
  for(const u of units){ if(u.type==="militia") continue;
    if(isFlyer(u)){
      if(u.order&&u.order.k==="sortie"&&u.seg){ res.fail++; continue; } // mid-sortie
      const base=u.loc;
      if(enemyAt&&!forceMove&&inRange(u,base,dst)&&(u.type!=="fighter"||G.units.some(x=>atWar(x.owner,owner)&&x.loc===dst&&isAir(x)))){
        if(G.time<u.ready||F(owner).noFuel){ res.fail++; continue; }
        u.order={k:"sortie",tgt:dst,home:base}; u.path=[]; res.strike++; continue; }
      if(u.type==="missile"&&enemyAt){ res.fail++; continue; }
      if(!q.sea&&(q.owner===owner||isAlly(owner,q.owner))&&!enemyAt){ u.order=null; u.path=[dst]; res.moved++; } else res.fail++;
      continue; }
    if((u.type==="artillery"||isSea(u))&&enemyAt&&!forceMove&&!u.seg&&u.loc!=null&&inRange(u,u.loc,dst)&&(isSea(u)?(q.sea||P(u.loc).adj.includes(dst)):true)){

      let target=dst; if(dom==="sea") target=seaDestFor(dst,start,owner); if(target==null){res.fail++;continue;}
      const pth=findPath(start,target,dom,owner);
      if(pth==null){ res.fail++; continue; }
      if(!queue){ u.path=pth; u.order=null; u.retreat=true; } else u.path=u.path.concat(pth);

  return res; }
function haltUnits(units){ for(const u of units){ u.path=[]; if(u.order&&u.order.k==="bombard") u.order=null; } }

// Advance movement for one sim step.
function movementStep(dt){
  for(const u of G.units){ if(!alive(u)) continue;
    // --- sortie launch / flight ---
    if(u.order&&u.order.k==="sortie"&&!u.seg&&u.loc!=null){ const o=u.order;
      if(!G.units.some(x=>atWar(x.owner,u.owner)&&x.loc===o.tgt&&!x.seg)){ u.order=null; }
      else { u.seg={from:u.loc,to:o.tgt,t:0,dur:provDist(u.loc,o.tgt)/unitSpeed(u)+0.05,sortie:"out"}; u.loc=null; } }
    if(u.seg){ u.seg.t+=dt; if(u.seg.t<u.seg.dur) continue;
      const s=u.seg; u.seg=null; u.loc=s.to;
      if(s.sortie==="out"){ resolveSortie(u); if(!alive(u)) continue;
        if(u.type==="missile"){ u.hp=0; continue; }
        let home=u.order&&u.order.home; if(home==null||P(home).owner!==u.owner) home=nearestOwnBase(u.owner,u.loc);
        if(home==null){ u.hp=0; continue; }
        u.seg={from:u.loc,to:home,t:0,dur:provDist(u.loc,home)/unitSpeed(u)+0.05,sortie:"back"}; u.loc=null; u.order=null; continue; }
      if(s.sortie==="back"){ u.ready=G.time+3; continue; }
      if(!isFlyer(u)) u.retreat=false;
      continue; }
    // --- depart toward next waypoint ---
    if(u.loc!=null&&u.path.length){
      const here=P(u.loc);
      if(!u.retreat&&!isFlyer(u)){
        if(contestedFor(u.owner,u.loc)) continue;               // pinned by combat
        if(isGround(u)&&!here.sea&&here.owner!==u.owner&&atWar(u.owner,here.owner)) continue; // holding to capture
      }
      if(isFlyer(u)&&(G.time<u.ready||F(u.owner).noFuel&&u.type!=="missile")) { if(F(u.owner).noFuel) continue; }
      if(!isFlyer(u)&&!passable(u.path[0],domainOf(u),u.owner)){ u.path=[]; continue; } // border closed by diplomacy
      const nx=u.path.shift();
      if(nx===u.loc) continue;
      u.seg={from:u.loc,to:nx,t:0,dur:isFlyer(u)?provDist(u.loc,nx)/unitSpeed(u)+0.05:hopTime(u,u.loc,nx)}; u.loc=null; u.retreat=false;

function nearestOwnBase(owner,from){ let best=null,bd=99; for(const p of G.provs){ if(p.sea||(p.owner!==owner&&!isAlly(owner,p.owner))) continue; const d=HOPS[from][p.id]; if(d<bd){bd=d;best=p.id;} } return best; }

/* =====================================================================
   SECTION 7 — CONTINUOUS COMBAT, BOMBARDMENT, CAPTURE, ELIMINATION
   Every sim step, provinces holding stationed units of 2+ sides fight:
   each unit applies damage-per-hour to a chosen foe:
     dmg/h = base × counter × rnd(0.8–1.2) × 10/(8+DEF) / terrainDef × COMBAT_K
   base = ATK for the attacker, DEF×0.85 for the province holder.
   Artillery/frigates bombard in range without counter-fire; air sorties
   resolve a single burst on arrival with AA/fighter fire first.
   ===================================================================== */
function defMod(p,u){ if(p.sea||!isGround(u))return 1; let m=TERRAIN[p.terrain].def; if(hasTech(u.owner,"entrench")&&p.owner===u.owner)m*=1.2; if(p.capitalOf!=null&&p.capitalOf===u.owner)m*=CAPITAL_DEF; if(p.owner===u.owner&&u.owner>=0)m*=1+RALLY_DEF*rallyK(u.owner); return m; }
function mult(a,t){ let m=COUNTER[a.type][UNITS[t.type].cls]??0; if(a.type==="aa"&&isAir(t)&&hasTech(a.owner,"iads"))m*=1.6; return m; }
function pickTarget(a,foes){ let best=null,bv=0; for(const t of foes){ if(t.hp<=0)continue; const m=mult(a,t); if(m<=0)continue; const v=m*(1.6-t.hp/maxHp(t)*0.6); if(v>bv){bv=v;best=t;} } return best; }
function dmgOf(a,t,base,p){ return base*mult(a,t)*rnd(0.8,1.2)*(10/(8+stat(t,"def")))/defMod(p,t); }
function contested(pid){ const us=U(pid); if(us.length<2) return false; const o=us[0].owner; for(const u of us) if(u.owner!==o){ for(const a of us) for(const b of us) if(atWar(a.owner,b.owner)) return true; return false; } return false; }
function contestedFor(owner,pid){ const us=U(pid); let mine=false,foe=false; for(const u of us){ if(u.owner===owner) mine=true; else if(atWar(owner,u.owner)) foe=true; } return mine&&foe; }
function defencePower(pid){ const p=P(pid); let s=0; for(const u of U(pid)) s+=power(u)*defMod(p,u); return s; }

function applyDamage(t,d,p,attOwner){ if(d<=0) return; t.hp-=d; p.fxd=(p.fxd||0)+d; p.fxo=t.owner;
  if(t.hp<=0&&!t.dead){ t.dead=true; onKill(t,attOwner,p); } }
function onKill(t,by,p){
  if(by>=0) F(by).kills++;
  if(by===0) G.stats.kills++; if(t.owner===0) G.stats.lost++; noteLoss(t,by);
  if(p.bt){ p.bt.loss[t.owner]=(p.bt.loss[t.owner]||0)+1; }
  addFx({k:"boom",pid:p.id,col:t.owner>=0?F(t.owner).color:NEUTRAL_COLOR,life:0.9,big:true}); }

function combatStep(dt){
  for(const p of G.provs){ const us=U(p.id);
    if(!contested(p.id)){ if(p.bt) endBattle(p); continue; }
    if(!p.bt){ p.bt={start:G.time,sides:[...new Set(us.map(u=>u.owner))],loss:{}}; G.stats.battles++;
      if(p.bt.sides.includes(0)) { toast(`Battle at ${p.name}`,"warn","⚔"); } }
    for(const u of us) if(!p.bt.sides.includes(u.owner)) p.bt.sides.push(u.owner);
    for(const a of us){ if(a.hp<=0||a.type==="missile") continue;
      let t=a.tg&&us.find(x=>x.id===a.tg&&x.hp>0&&x.owner!==a.owner);
      if(t&&!atWar(a.owner,t.owner)) t=null;
      if(!t||rand()<0.05){ t=pickTarget(a,us.filter(x=>atWar(x.owner,a.owner))); a.tg=t?t.id:0; }
      if(!t) continue;
      const holder=(a.owner===p.owner&&!p.sea);
      const base=holder?stat(a,"def")*0.85:stat(a,"atk");
      applyDamage(t,dmgOf(a,t,base,p)*COMBAT_K*dt,p,a.owner); }
    for(let i=us.length-1;i>=0;i--) if(us[i].hp<=0) us.splice(i,1);
  } }
function endBattle(p){ const b=p.bt; p.bt=null; const us=U(p.id); const winner=us.length?us[0].owner:null;
  if(!b.sides.includes(0)&&!b.sides.some(s=>s>=0&&P(p.id).owner===0)) { // AI-vs-AI: brief log only for major ones
    const tot=Object.values(b.loss).reduce((a,c)=>a+c,0); if(tot>=3&&winner!=null&&winner>=0) log(`${F(winner).short} prevails at ${p.name} (${tot} units destroyed).`,""); return; }
  const mineLost=b.loss[0]||0, theirs=Object.entries(b.loss).filter(([k])=>+k!==0).reduce((a,[,c])=>a+c,0);
  const foes=b.sides.filter(s=>s!==0).map(s=>s<0?"militia":F(s).short).join(", ");
  if(winner===0){ log(`Battle of ${p.name} won vs ${foes} — ${theirs} destroyed, ${mineLost} lost.`,"good"); }
  else if(winner!=null){ log(`Battle of ${p.name} lost vs ${foes} — ${theirs} destroyed, ${mineLost} lost.`,"bad"); toast(`Defeat at ${p.name}`,"bad","✖"); }
}
// continuous bombardment by artillery / frigates; auto-targets when idle
function bombardStep(dt){
  for(const u of G.units){ if(!alive(u)||u.seg||u.loc==null) continue; if(u.type!=="artillery"&&!isSea(u)) continue;
    const o=u.order; if(!o||o.k!=="bombard") continue;
    if(!inRange(u,u.loc,o.tgt)){ u.order=null; continue; }
    const foes=U(o.tgt).filter(x=>atWar(x.owner,u.owner)&&x.hp>0); if(!foes.length){ u.order=null; continue; }
    if(isSea(u)&&!(P(o.tgt).sea||P(u.loc).adj.includes(o.tgt))){ u.order=null; continue; }
    const t=pickTarget(u,foes); if(!t) continue; const p=P(o.tgt);
    applyDamage(t,dmgOf(u,t,stat(u,"atk"),p)*COMBAT_K*0.8*dt,p,u.owner);
    if(rand()<dt*2.2) addFx({k:"shell",from:u.loc,pid:o.tgt,col:F(u.owner).color,life:0.7}); } }
function autoTargetStep(){ // hourly: idle artillery & frigates pick the juiciest enemy stack in range
  for(const u of G.units){ if(!alive(u)||u.seg||u.loc==null||u.path.length||(u.order&&u.order.k==="bombard")) continue;
    if(u.type!=="artillery"&&!isSea(u)) continue; if(u.owner>=0&&G.world&&!warsOf(u.owner)) continue; let best=null,bv=0; const rr=stat(u,"rng"), hr=HOPS[u.loc];
    for(const p of G.provs){ if(hr[p.id]>rr) continue; if(isSea(u)&&!(p.sea||P(u.loc).adj.includes(p.id))) continue;
      const foes=U(p.id).filter(x=>atWar(x.owner,u.owner)); if(!foes.length) continue;
      if(foes[0].owner<0&&!contestedFor(u.owner,p.id)) continue; // don't waste shells on idle militia
      const v=stackPower(foes)+(contestedFor(u.owner,p.id)?20:0); if(v>bv){bv=v;best=p.id;} }
    if(best!=null) u.order={k:"bombard",tgt:best}; } }
// air / missile sortie arrives over target: AA & nearby fighters fire, then the strike lands
function resolveSortie(u){
  const p=P(u.loc); const def=U(p.id).filter(x=>atWar(x.owner,u.owner)&&x.hp>0);
  const shooters=def.filter(x=>x.type==="aa"||x.type==="fighter"||isSea(x));
  for(const a of p.adj) for(const x of U(a)) if(atWar(x.owner,u.owner)&&x.type==="fighter") shooters.push(x); // interceptors
  for(const s of shooters){ if(u.hp<=0) break; if(mult(s,u)<=0) continue; applyDamage(u,dmgOf(s,u,stat(s,"def")*0.85,p),p,s.owner); }
  addFx({k:"flak",pid:p.id,life:0.8,n:shooters.length});
  if(u.hp<=0){ if(u.owner===0) log(`${unitName(u)} shot down over ${p.name}.`,"bad"); return; }
  const t=pickTarget(u,def); if(!t){ return; }
  let d=dmgOf(u,t,stat(u,"atk"),p)*1.1; applyDamage(t,d,p,u.owner);
  // splash onto a second target for bombers & missiles
  if(u.type!=="fighter"){ const t2=pickTarget(u,def.filter(x=>x!==t&&x.hp>0)); if(t2) applyDamage(t2,d*0.4,p,u.owner); }
  addFx({k:"strike",pid:p.id,col:F(u.owner).color,life:1.1});
  if(u.owner===0||def.some(x=>x.owner===0)) log(`${u.owner===0?"":F(u.owner).short+" "}${unitName(u)} struck ${p.name}${def.some(x=>x.hp<=0)?" — target destroyed":""}.`, u.owner===0?"good":"bad");
}
// ground units alone in a non-owned land province capture it over time
function captureStep(dt){
  for(const p of G.provs){ if(p.sea) continue; const us=U(p.id).filter(isGround);
    if(!us.length||contested(p.id)){ p.capBy=null; p.capT=0; continue; }
    const att=us.find(x=>x.owner>=0&&x.owner!==p.owner&&atWar(x.owner,p.owner)); if(!att){ p.capBy=null; p.capT=0; continue; }
    const o=att.owner; if(us.some(x=>x.owner===p.owner&&p.owner>=0)){ p.capBy=null; p.capT=0; continue; }
    if(p.capBy!==o){ p.capBy=o; p.capT=0; }
    p.capT+=dt; if(p.capT>=captureNeed(p)) capture(p.id,o); } }
function captureNeed(p){ return p.capitalOf!=null?CAPITAL_CAPTURE_H:2+p.city*1.5; }
function capture(pid,by){
  const p=P(pid); const prev=p.owner; p.owner=by; invalidateN(); p.capBy=null; p.capT=0; p.queue=[]; if(prev>=0){ p.occT=G.time; noteProvLost(prev,by); } if(p.core==null) p.core=by;
  if(by===0){ G.stats.captured++; log(`Captured ${p.name}.`,"good"); }
  else if(prev===0){ log(`${F(by).short} seized our province ${p.name}!`,"bad"); toast(`${p.name} lost to ${F(by).short}`,"bad","⚑"); }
  addFx({k:"capture",pid,col:F(by).color,life:1.6});
  if(p.capitalOf!=null&&p.capitalOf!==by){ const lost=p.capitalOf; p.capitalOf=null; if(!relocateCapital(lost,by)) eliminate(lost,by); }
  [prev,by].forEach(f=>{ if(f>=0) F(f).inc=computeIncome(f); });
  mapDirty=true; checkGameOver(); }
function eliminate(id,by){
  const f=F(id); if(!f.alive) return; f.alive=false;
  const loot={c:Math.floor(f.res.c*0.5),f:Math.floor(f.res.f*0.5)}; F(by).res.c+=loot.c; F(by).res.f+=loot.f;
  log(`☠ The capital of ${f.name} has fallen to ${F(by).short}! The nation collapses.`, id===0?"bad":"acc");
  toast(`${f.short} has collapsed`, id===0?"bad":"good","☠");
  for(const u of G.units) if(u.owner===id) u.hp=0;
  rebuildIndex();
  for(const p of G.provs){ if(p.owner===id){ p.queue=[]; if(G.world&&!p.sea){ p.owner=by; p.occT=G.time; } else { p.owner=-1; if(!p.sea&&!U(p.id).length) newUnit("militia",-1,p.id); } } }
  invalidateN(); if(G.world) F(by).inc=computeIncome(by);
  rebuildIndex(); mapDirty=true; checkGameOver(); }
// Domination must be HELD: share of land >= VICTORY_SHARE for DOMINATION_DAYS (tracked hourly in dominationStep).
// Bloc victory: every surviving rival is our ally (and we lead the bloc) for the same period.
function checkGameOver(){
  if(!G||G.over) return;
  if(!F(0).alive){ G.over="defeat"; G.overWhy="Your capital has fallen and the nation has collapsed."; G.overT=G.time; showEnd(); return; }
  if(G.factions.slice(1).every(f=>!f.alive)){ G.over="victory"; G.overWhy="All rival capitals captured."; G.overT=G.time; showEnd(); return; }
  for(const f of G.factions) if(f.id&&f.alive){ const d=G.dom&&G.dom[f.id]; if(d&&d.share>=aiDomShare()&&d.h>=DOMINATION_DAYS*24&&G.time>=(G.world?WORLD_AI_MIN_DAY:AI_DOM_MIN_DAY)*24){ G.over="defeat"; G.overWhy=`${f.name} held ${Math.round(aiDomShare()*100)}% of the ${G.world?"world":"continent"} for ${DOMINATION_DAYS} days.`; G.overT=G.time; showEnd(); return; } }
  const dm=G.dom&&G.dom[0]; if(dm&&dm.h>=DOMINATION_DAYS*24){ G.over="victory"; G.overWhy=G.world?(dm.why==="bloc"?`Your alliance bloc held ${Math.round(WORLD_BLOC*100)}% of the world for ${DOMINATION_DAYS} days.`:dm.why==="caps"?`You held ${WORLD_CAPS} major world capitals for ${DOMINATION_DAYS} days.`:`You held ${Math.round(WORLD_SOLO*100)}% of the world for ${DOMINATION_DAYS} days.`):dm.bloc?`Your alliance bloc held the continent for ${DOMINATION_DAYS} days.`:`You held ${Math.round(VICTORY_SHARE*100)}% of the continent for ${DOMINATION_DAYS} days.`; G.overT=G.time; showEnd(); } }
function domShare(fid){ if(G.world) return natSize(fid)/(G.nLand||(G.nLand=landProvs().length)); const lands=landProvs(); return lands.filter(p=>p.owner===fid).length/lands.length; }
const WORLD_SOLO=0.30, WORLD_BLOC=0.45, WORLD_BLOC_LEAD=0.15, WORLD_CAPS=4, WORLD_AI_DOM=0.33, WORLD_AI_MIN_DAY=45;
function majorCapsHeld(fid){ let n=0; for(const p of G.provs) if(p.cap0&&p.owner===fid&&p.ctry>=0&&p.ctry!==F(fid).cdef&&COUNTRIES[p.ctry].major) n++; return n; }
function worldDomStep(){ const d0=G.dom;
  for(const f of G.factions){ if(!f.alive){ delete d0[f.id]; continue; } const d=d0[f.id]||(d0[f.id]={h:0,bloc:false,peak:0});
    const share=domShare(f.id); d.share=share; d.peak=Math.max(d.peak,share); let ok=false, why="";
    if(f.id===0){ const al=alliesOf(0); const bs=share+al.reduce((t,o)=>t+domShare(o),0); const caps=majorCapsHeld(0); d.caps=caps; d.blocShare=bs;
      if(share>=WORLD_SOLO){ ok=true; why="solo"; } else if(al.length&&bs>=WORLD_BLOC&&share>=WORLD_BLOC_LEAD&&al.every(o=>domShare(o)<=share)){ ok=true; why="bloc"; } else if(caps>=WORLD_CAPS){ ok=true; why="caps"; }
      d.bloc=why==="bloc"; d.why=why;
      if(ok&&d.h===0) dipEvent(`Our dominance is recognised (${why==="solo"?"30% of the world":why==="bloc"?"our bloc holds 45% of the world":WORLD_CAPS+" major capitals"}) — hold it for ${DOMINATION_DAYS} days to win.`,"good","★",true); }
    else { ok=share>=WORLD_AI_DOM; if(ok&&d.h===0) dipEvent(`⚠ ${f.name} controls ${Math.round(share*100)}% of the world — if it holds for ${DOMINATION_DAYS} days we lose.`,"bad","⚠",true); }
    if(ok){ d.h+=1; if(!d.first) d.first=G.time; } else d.h=Math.max(0,d.h-3); } }
function dominationStep(){ if(!G.dom) G.dom={}; if(G.world) return worldDomStep(); const lands=landProvs().length;
  for(const f of G.factions){ if(!f.alive){ delete G.dom[f.id]; continue; } const d=G.dom[f.id]||(G.dom[f.id]={h:0,bloc:false,peak:0});
    const share=domShare(f.id); const rivals=G.factions.filter(o=>o.alive&&o.id!==f.id);
    const al=alliesOf(f.id), blocShare=share+al.reduce((t,o)=>t+domShare(o),0);
    const bloc=rivals.length>0&&share>=Math.max(...rivals.map(o=>domShare(o.id)))&&(rivals.every(o=>isAlly(f.id,o.id))||(al.length&&blocShare>=blocNeed().share&&share>=blocNeed().lead));
    const ok=share>=VICTORY_SHARE||bloc; d.bloc=bloc&&share<VICTORY_SHARE; d.share=share; d.peak=Math.max(d.peak,share);
    if(ok){ if(d.h===0&&f.id===0) dipEvent(`Our dominance is recognised — hold it for ${DOMINATION_DAYS} days to win.`,"good","★",true); if(d.h===0&&f.id&&share>=aiDomShare()) dipEvent(`⚠ ${f.name} controls ${Math.round(share*100)}% of the continent — if it holds for ${DOMINATION_DAYS} days we lose.`,"bad","⚠",true); d.h+=1; if(!d.first) d.first=G.time; } else d.h=Math.max(0,d.h-3); } }
function blocNeed(){ const n=G.factions.length; return n>=5?{share:BLOC_SHARE_BIG,lead:BLOC_LEAD_BIG}:{share:BLOC_SHARE,lead:BLOC_LEAD_MIN}; }
function relocateCapital(id,by){ // a large nation's government flees instead of collapsing outright
  const f=F(id); f.relocs=f.relocs||0; const own=G.provs.filter(q=>!q.sea&&q.owner===id&&!contested(q.id));
  if(f.relocs>=CAPITAL_RELOCATES||own.length<CAPITAL_RELOCATE_MIN) return false;
  const np=own.sort((a,b)=>b.city-a.city||U(b.id).length-U(a.id).length)[0]; f.relocs++; f.capital=np.id; np.capitalOf=id; np.city=Math.max(np.city,2);
  f.weary=clamp(f.weary+CAPITAL_RELOCATE_WEARY,0,100); f.res.c=Math.floor(f.res.c*0.7);
  const loot=Math.floor(f.res.c*0.2); F(by).res.c+=loot;
  dipEvent(`🏛 ${f.short}'s capital falls to ${F(by).short} — the government relocates to ${np.name}.`, id===0?"bad":"acc","🏛", id===0||by===0);
  mapDirty=true; return true; }
function aiDomShare(){ if(G.world) return WORLD_AI_DOM; return G.factions.length<=3?AI_DOM_SHARE_SMALL:AI_DOM_SHARE; }

/* =====================================================================
   SECTION 8 — REAL-TIME SIMULATION LOOP
   requestAnimationFrame drives everything. Real elapsed time × speed ×
   HOURS_PER_SEC feeds an accumulator that is drained in fixed SIM_DT
   (0.1 game-hour) steps, so the simulation is deterministic per step and
   fully decoupled from the render frame rate. Hourly work (income recalc,
   healing, auto-targeting, fog, victory checks) runs on hour boundaries;
   each AI commander re-plans on its own interval.
   ===================================================================== */
const SIM = { acc:0, last:0, steps:0, lastSave:0, frame:0, fps:60 };
function simStep(dt){
  if(!G||G.over) return;
  const prevHour=Math.floor(G.time); G.time+=dt; SIM.steps++;
  rebuildIndex();
  movementStep(dt);
  rebuildIndex();
  combatStep(dt);
  bombardStep(dt);
  rebuildIndex();
  captureStep(dt);
  economyStep(dt);
  productionStep(dt);
  researchStep(dt);
  if(Math.floor(G.time)!==prevHour) hourlyStep();
  for(const f of G.factions){ if(G.over) break; if(f.ai&&f.alive&&G.time>=f.nextDiplo){ f.nextDiplo=G.time+DIPLO_THINK_H*(0.8+rand()*0.4);
      try{ aiDiplomacy(f.id); }catch(e){ console.error(e); } } }
  for(const f of G.factions){ if(G.over) break; if(f.ai&&f.alive&&G.time>=f.nextThink){
      f.nextThink=G.time+DIFF[G.diff].think*(0.85+rand()*0.3)*(G.world&&!warsOf(f.id)&&!contestedOwn(f.id)?2.5:1);
      try{ aiThink(f.id); }catch(e){ console.error(e); } } }
}
function hourlyStep(){
  for(const f of G.factions) if(f.alive) f.inc=computeIncome(f.id);
  diploHourly(); levyStep(); dominationStep();
  healStep(1); autoTargetStep(); computeVis();
  // alert when enemies are inbound on our capital
  const cap=F(0).capital; if(F(0).alive&&cap!=null){ const inbound=G.units.filter(u=>u.owner>0&&u.seg&&(pathEnd(u)===cap)).length;
    if(inbound&&G.time-(UI.lastCapWarn||-99)>12){ UI.lastCapWarn=G.time; toast(`Enemy forces inbound to ${P(cap).name}!`,"bad","⚠"); log(`⚠ Intelligence: ${inbound} hostile unit(s) en route to our capital.`,"bad"); } }
  checkGameOver(); }
// home guard: a besieged capital raises a free rifle brigade periodically, so annihilation is slow and costly
function levyStep(){ for(const f of G.factions){ if(!f.alive) continue; const cap=f.capital; if(cap==null||cap<0) continue;
  const threatened=contestedFor(f.id,cap)||P(cap).adj.some(a=>U(a).some(u=>u.owner>=0&&atWar(f.id,u.owner)&&isGround(u)));
  if(threatened&&G.time-f.levyT>=LEVY_HOURS*clamp(natSize(f.id)/8,0.5,1)){ f.levyT=G.time; newUnit("infantry",f.id,cap); if(f.id===0) log(`Home guard mobilised at ${P(cap).name}.`,"warn"); } } }
// run N game hours instantly (used by the test harness; not by gameplay)
function simHours(h){ const n=Math.round(h/SIM_DT); for(let i=0;i<n&&!G.over;i++) simStep(SIM_DT); }
function setSpeed(s){ if(s>0) UI.prevSpeed=s; UI.speed=s; updateTop(); }
function frame(now){
  const dtReal=Math.min(0.25,Math.max(0,(now-(SIM.last||now))/1000)); SIM.last=now; SIM.fps=SIM.fps*0.95+(dtReal>0?1/dtReal:60)*0.05;
  if(G&&!G.over&&UI.speed>0&&!UI.modal){
    SIM.acc+=dtReal*UI.speed*HOURS_PER_SEC; let n=0;
    while(SIM.acc>=SIM_DT&&n<30){ simStep(SIM_DT); SIM.acc-=SIM_DT; n++; }
    if(n>=30) SIM.acc=0; // never spiral: drop backlog
  }

/* =====================================================================
   SECTION 9 — AI COMMANDERS (real-time)
   Each nation re-plans every DIFF.think game hours (staggered, jittered):

        already EN ROUTE to each province — so the AI reacts to incoming
        attacks)   3) production queues weighted by needs   4) air sorties,
        missiles & artillery fire   5) offensives: gather idle forces within
        2 hops where power ≥ defence × difficulty ratio, ranked by value/defence

const PEACE_ARMY_K = 0.8;    // peacetime army-power cap = economy × this (war: WAR_ARMY_K)
const WAR_ARMY_K = 1.6;
const PEACE_RESERVE = 120;   // extra credits banked while at peace
function aiDevelop(fid){ // invest in cities when safe and solvent
  const f=F(fid); if(enemiesOf(fid).length>0&&f.res.c<900) return;
  const opts=G.provs.filter(p=>!p.sea&&p.owner===fid&&p.city<3&&canDevelop(fid,p.id)).sort((a,b)=>b.city-a.city||(b.oil?1:0)-(a.oil?1:0));
  if(opts.length&&f.res.c>devCost(opts[0])+250) developCity(fid,opts[0].id); }
const AI_RESEARCH = {
  easy:  ["entrench","industry","jets","composite","conscript","synfuel","amphib","iads","precision","bombing"],
  normal:["industry","jets","composite","entrench","bombing","synfuel","iads","precision","conscript","amphib"],
  hard:  ["industry","jets","composite","bombing","precision","synfuel","iads","entrench","conscript","amphib"],

function threatMap(fid){
  const th=new Map();

  for(const u of G.units) if(u.owner>=0&&atWar(fid,u.owner)&&(u.seg||u.path.length)){ const e=pathEnd(u); inbound.set(e,(inbound.get(e)||0)+power(u)); }
  for(const p of G.provs){ if(p.owner!==fid) continue; let t=inbound.get(p.id)||0;
    for(const a of p.adj){ const h=hostileUnits(fid,a); if(h.length&&h[0].owner>=0) t+=stackPower(h)*0.8;
      for(const u of U(a)) if(u.owner>=0&&u.owner!==fid&&!atWar(fid,u.owner)&&!isAlly(fid,u.owner)&&isGround(u)) t+=power(u)*(rel(fid,u.owner)<-30?0.3:0.12); } // watch uneasy neighbours

function provValue(fid,p){ let v=8+p.city*10+(p.oil?6:0); if(p.capitalOf!=null&&p.capitalOf!==fid)v+=70; if(p.owner===0)v+=DIFF[G.diff].playerFocus; if(p.owner<0)v+=6; return v; }
function idle(u){ return alive(u)&&!u.seg&&u.loc!=null&&!u.path.length&&!(u.order&&u.order.k==="sortie"); }
function frontField(fid){ const dist=new Map(), q=[];
  // the front is where we can fight (enemies at war, unaligned land); in full peace, every foreign border
  for(const p of G.provs){ if(p.sea||p.owner!==fid)continue; if(p.adj.some(a=>!P(a).sea&&P(a).owner!==fid&&atWar(fid,P(a).owner))){dist.set(p.id,0);q.push(p.id);} }
  if(!q.length) for(const p of G.provs){ if(p.sea||p.owner!==fid)continue; if(p.adj.some(a=>!P(a).sea&&P(a).owner!==fid&&!isAlly(fid,P(a).owner))){dist.set(p.id,0);q.push(p.id);} }
  let h=0; while(h<q.length){ const c=q[h++]; for(const a of P(c).adj){ const p=P(a); if(p.sea||p.owner!==fid||dist.has(a))continue; dist.set(a,dist.get(c)+1); q.push(a);} }
  return dist; }
function reserveNeed(fid,pid,th,D){ const p=P(pid); let need=(th.get(pid)||0)*D.caution*0.35; if(p.capitalOf===fid) need=Math.max((th.get(pid)||0)*D.caution*0.7,16); return need; }
function avgMult(u,foes){ let s=0,n=0; for(const t of foes){ s+=mult(u,t); n++; } return n?Math.max(0.3,s/n):1; }

function aiThink(fid){
  const f=F(fid), D=DIFF[G.diff]; if(!f.alive) return;
  if(!f.tech.cur){ for(const t of AI_RESEARCH[G.diff]) if(canResearch(fid,t)&&f.res.c-TECH[t].cost.c>60){ startResearch(fid,t); break; } }
  const th=threatMap(fid);
  aiDevelop(fid);
  aiBuild(fid,th,D);
  aiStrikes(fid);
  const used=new Set();
  const nAtk=f.weary>=WEARY_ATTACK_STOP?0:Math.max(1,Math.round(D.attacks*(1-f.weary/120)));
  for(let k=0;k<nAtk;k++) if(!aiAttack(fid,th,D,used)) break;

  aiAdvance(fid,th,D,used);

function aiBuild(fid,th,D){
  const f=F(fid);
  const cities=G.provs.filter(p=>!p.sea&&p.owner===fid&&p.city>0&&p.queue.length<D.queue&&!contested(p.id));
  if(!cities.length) return;
  const front=frontField(fid);
  cities.sort((a,b)=>(th.get(b.id)||0)-(th.get(a.id)||0) || (front.get(a.id)??99)-(front.get(b.id)??99));
  const mine={}; let enemyAir=0, enemyArmor=0, enemyFleet=0;
  for(const u of G.units){ if(u.owner===fid) mine[u.type]=(mine[u.type]||0)+1; else if(u.owner>=0){ if(isAir(u))enemyAir++; if(u.type==="armor")enemyArmor++; if(isSea(u))enemyFleet++; } }
  for(const p of G.provs) for(const q of p.queue) if(p.owner===fid) mine[q.type]=(mine[q.type]||0)+1;
  const total=Object.values(mine).reduce((a,b)=>a+b,0);
  // peacetime: keep a standing army sized to the economy and bank the rest for development
  const atPeace=!enemiesOf(fid).length, mil=natMil(fid), cap=natEcon(fid)*(atPeace?PEACE_ARMY_K:WAR_ARMY_K);
  const tense=G.factions.some(o=>o.alive&&o.id!==fid&&BORDER[fid][o.id]&&!isAlly(fid,o.id)&&rel(fid,o.id)<-40);
  if(atPeace&&mil>cap*(tense?1.4:1)&&!borderNeutral(fid)) return;
  if(!atPeace&&mil>cap) return;
  for(const city of cities){
    if(f.res.c<D.reserve+40+(atPeace?PEACE_RESERVE:0)) break;
    const w={infantry:3, armor:f.res.f>40?3:0.5, artillery:(mine.artillery||0)<total*0.18?2:0.4, aa:enemyAir>(mine.aa||0)?3:0.3,
             fighter:enemyAir>(mine.fighter||0)?2:0.8, bomber:enemyArmor>2?2.5:1.2, frigate:enemyFleet>=(mine.frigate||0)?1.2:0.3, missile:f.res.c>350?1:0};
    if((mine.infantry||0)<total*0.3) w.infantry+=3;
    const opts=BUILD_ORDER.filter(t=>w[t]>0&&canBuild(fid,t,city.id)); if(!opts.length) continue;
    let r=rand()*opts.reduce((s,t)=>s+w[t],0), type=opts[0]; for(const t of opts){ r-=w[t]; if(r<=0){type=t;break;} }
    if(queueBuild(fid,type,city.id)) mine[type]=(mine[type]||0)+1; } }
function aiStrikes(fid){
  for(const u of G.units){ if(u.owner!==fid||!idle(u)) continue;
    if(!(u.type==="bomber"||u.type==="missile")||G.time<u.ready||F(fid).noFuel) continue;
    let best=null,bv=0;
    for(const q of G.provs){ if(!inRange(u,u.loc,q.id)) continue; const h=hostileUnits(fid,q.id); if(!h.length) continue;
      let v=stackPower(h)+(q.capitalOf!=null?15:0)+(h[0].owner===0?DIFF[G.diff].playerFocus:0);
      const sam=h.filter(x=>x.type==="aa"||x.type==="fighter").length; if(u.type==="bomber") v-=sam*14;
      if(contestedFor(fid,q.id)) v+=18; if(q.adj.some(a=>P(a).owner===fid)) v+=8; if(h[0].owner<0) v*=0.5;
      if(v>bv){bv=v;best=q.id;} }
    if(best!=null&&(u.type!=="missile"||bv>=28)) issueOrder([u],best,false); } }
function aiAttack(fid,th,D,used){
  const cand=new Set();
  for(const p of G.provs){ if(p.sea||p.owner!==fid) continue; for(const a of p.adj){ const q=P(a); if(!q.sea&&((q.owner!==fid&&atWar(fid,q.owner))||hostileUnits(fid,a).length)) cand.add(a); } }
  // power already heading to each target counts towards it
  const enroute=new Map(); for(const u of G.units) if(u.owner===fid&&(u.seg||u.path.length)&&isGround(u)){ const e=pathEnd(u); enroute.set(e,(enroute.get(e)||0)+power(u)); }
  let best=null;
  for(const tid of cand){ const t=P(tid); const dp=defencePower(tid);
    const contrib=[]; let pow=enroute.get(tid)||0;
    for(const s of G.provs){ if(s.sea||s.owner!==fid||LHOPS[s.id][tid]>2) continue;
      const ready=U(s.id).filter(u=>u.owner===fid&&isGround(u)&&idle(u)&&!used.has(u.id)&&u.type!=="militia").sort((x,y)=>power(y)-power(x));
      if(!ready.length) continue;
      let keep=reserveNeed(fid,s.id,th,D) - stackPower(U(s.id).filter(u=>u.owner===fid&&!ready.includes(u)));
      if(contestedFor(fid,s.id)) continue;
      const avail=ready.slice(); while(keep>0&&avail.length){ const u=avail.pop(); keep-=power(u)*defMod(s,u); }
      const far=LHOPS[s.id][tid]===2?0.75:1;
      for(const u of avail){ contrib.push([s.id,u]); pow+=power(u)*(U(tid).length?avgMult(u,U(tid)):1)*far; } }

  go.forEach(u=>used.add(u.id));

  if(P(best.tid).owner===0&&rand()<0.5) log(`Intel: ${F(fid).short} forces are moving on ${P(best.tid).name}.`,"warn");
  return true; }
function aiReinforce(fid,th,D,used){ // send idle units to contested or under-defended own provinces
  for(const p of G.provs){ if(p.sea||p.owner!==fid) continue;
    let deficit=reserveNeed(fid,p.id,th,D)-stackPower(ownUnits(fid,p.id));
    if(contestedFor(fid,p.id)) deficit=Math.max(deficit,stackPower(hostileUnits(fid,p.id))*1.2-stackPower(ownUnits(fid,p.id)));
    if(deficit<=4) continue;
    const pool=[]; for(const a of graphDist(p.id,2,q=>!q.sea&&q.owner===fid).keys()){ if(a===p.id) continue; if(contestedFor(fid,a)) continue;
      const spare=stackPower(ownUnits(fid,a))-reserveNeed(fid,a,th,D)-4; if(spare<=0) continue; let acc=0;
      for(const u of ownUnits(fid,a).filter(u=>isGround(u)&&idle(u)&&!used.has(u.id)).sort((x,y)=>power(x)-power(y))){ if(acc>=spare) break; pool.push(u); acc+=power(u); } }
    const go=[]; let acc=0; for(const u of pool){ if(acc>=deficit) break; go.push(u); acc+=power(u); used.add(u.id); }
    if(go.length) issueOrder(go,p.id,false,true); } }
function aiAdvance(fid,th,D,used){
  const front=frontField(fid);
  for(const p of G.provs){ if(p.sea||p.owner!==fid) continue; const d=front.get(p.id); if(d==null||d===0) continue;
    let mv=ownUnits(fid,p.id).filter(u=>isGround(u)&&idle(u)&&!used.has(u.id)&&u.type!=="aa"); if(!mv.length) continue;
    if(p.capitalOf===fid){ mv.sort((a,b)=>power(b)-power(a)); let keep=reserveNeed(fid,p.id,th,D); while(keep>0&&mv.length){ const u=mv.pop(); keep-=power(u)*defMod(p,u);} }

    if(tgt!=null){ mv.forEach(u=>used.add(u.id)); issueOrder(mv,tgt,false,true); } } }
function aiNavy(fid,used){
  for(const u of G.units){ if(u.owner!==fid||!isSea(u)||!idle(u)||used.has(u.id)) continue; if(u.order&&u.order.k==="bombard") continue;
    const here=P(u.loc);
    // attack weaker adjacent fleets
    let tgt=null; for(const a of here.adj){ const q=P(a); if(!q.sea) continue; const h=hostileUnits(fid,a).filter(isSea); if(h.length&&power(u)*1.0>stackPower(h)*0.8){ tgt=a; break; } }

function aiAir(fid,th){ // fighters cover the most threatened province; idle bombers rebase toward the front

  for(const u of G.units){ if(u.owner!==fid||!isAir(u)||!idle(u)) continue;
    if(u.type==="fighter"){ // intercept enemy air in range, else rebase to max threat

// ---- outline tracing: loops of cell edges separating group g from others ----
function traceLoops(groupOf){ // returns Map group -> array of loops (arrays of [x,y] in cell corners)
  const W=G.W,H=G.H, out=new Map(); const edges=new Map(); // per group: Map vertexKey -> [targets]
  const K=(x,y)=>y*(W+1)+x;
  const add=(g,x1,y1,x2,y2)=>{ if(!edges.has(g)) edges.set(g,new Map()); const m=edges.get(g); const k=K(x1,y1); if(!m.has(k)) m.set(k,[]); m.get(k).push(K(x2,y2)); };
  const gAt=(x,y)=>(x<0||y<0||x>=W||y>=H)?-999:groupOf(y*W+x);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const g=gAt(x,y); if(g===-999||g==null) continue;
    if(gAt(x,y-1)!==g) add(g,x,y,x+1,y); if(gAt(x+1,y)!==g) add(g,x+1,y,x+1,y+1);
    if(gAt(x,y+1)!==g) add(g,x+1,y+1,x,y+1); if(gAt(x-1,y)!==g) add(g,x,y+1,x,y); }

    for(const [k0] of m){ while(m.get(k0)&&m.get(k0).length){ const loop=[]; let k=k0, guard=0;
        do{ const lst=m.get(k); if(!lst||!lst.length) break; const nk=lst.pop(); loop.push([k%(W+1),Math.floor(k/(W+1))]); k=nk; }while(k!==k0&&guard++<200000);
        if(loop.length>2) loops.push(loop); } }
    out.set(g,loops); }
  return out; }
function simplify(loop){ const n=loop.length, out=[]; for(let i=0;i<n;i++){ const a=loop[(i-1+n)%n], b=loop[i], c=loop[(i+1)%n];

function bakeTerrain(){

function bar(key){ return `<div class="pb"><i data-pb="${key}"></i></div>`; }
function fillBars(){ document.querySelectorAll("[data-pb]").forEach(el=>{ const k=el.dataset.pb.split(":"); let v=0, txt=null;
  if(k[0]==="q"){ const p=P(+k[1]), it=p.queue[+k[2]]; if(it){ v=it.t/it.need; txt=fmtDur((it.need-it.t)/buildRate(p)); } }
  else if(k[0]==="r"){ const t=F(0).tech; if(t.cur){ v=t.prog/(TECH[t.cur].days*24); txt=fmtDur(TECH[t.cur].days*24-t.prog); } }
  else if(k[0]==="cap"){ const p=P(+k[1]); v=p.capBy!=null?p.capT/captureNeed(p):0; }

  else if(k[0]==="dom"){ v=(G.dom&&G.dom[0]?G.dom[0].h:0)/(DOMINATION_DAYS*24); }
  else if(k[0]==="share"){ v=landProvs().filter(p=>p.owner===0).length/landProvs().length/VICTORY_SHARE; }

  if(a==="load"){ if(loadGame()) hideModal(); } });
const keys=new Set();
window.addEventListener("keydown",ev=>{ if(!G||UI.modal){ if(ev.key==="Escape"&&G&&UI.modal&&!G.over) hideModal(); return; }
  const k=ev.key;
  if(k===" "){ ev.preventDefault(); setSpeed(UI.speed?0:UI.prevSpeed||1); }
  else if(k==="1") setSpeed(1); else if(k==="2") setSpeed(2); else if(k==="3") setSpeed(4);
  else if(k==="x"||k==="X"){ haltUnits(selectedUnits()); toast("Units halting","","■"); }
  else if(k==="Escape"){ UI.sel=null; UI.selUnits.clear(); renderPanel(true); }
  else if(k==="f"||k==="F"){ UI.fog=!UI.fog; computeVis(); updateTop(); }
  else if(k==="Tab"){ ev.preventDefault(); toggleSide(); }
  else if((k==="s"||k==="S")&&(ev.ctrlKey||ev.metaKey)){ ev.preventDefault(); saveGame(); }
  else if(k==="Home"&&F(0).capital!=null) centerOn(F(0).capital);
  keys.add(k.toLowerCase()); });
window.addEventListener("keyup",ev=>keys.delete(ev.key.toLowerCase()));
setInterval(()=>{ if(!G||UI.modal) return; const sp=9/cam.z; if(keys.has("w")||keys.has("arrowup")) cam.vy-=sp*0.2; if(keys.has("s")&&!keys.has("control")||keys.has("arrowdown")) cam.vy+=sp*0.2; if(keys.has("a")||keys.has("arrowleft")) cam.vx-=sp*0.2; if(keys.has("d")||keys.has("arrowright")) cam.vx+=sp*0.2; },16);

/* ---------------- TOUCH: pan, pinch-zoom, tap select / tap order, long-press queue ---------------- */
const TT={mode:null,sx:0,sy:0,lx:0,ly:0,moved:false,t0:0,lp:null,d0:0,z0:1,lastTap:0};
function tmid(ts){ return [(ts[0].clientX+ts[1].clientX)/2,(ts[0].clientY+ts[1].clientY)/2]; }
function tdist(ts){ return Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY); }
cv.addEventListener("touchstart",ev=>{ if(!G) return; ev.preventDefault(); const ts=ev.touches; clearTimeout(TT.lp); TT.lp=null; UI.zoomAnchor=null; cam.vx=cam.vy=0;
  if(ts.length===1){ const t=ts[0]; Object.assign(TT,{mode:"pan",sx:t.clientX,sy:t.clientY,lx:t.clientX,ly:t.clientY,moved:false,t0:performance.now()});
    if(selectedUnits().some(u=>u.owner===0)) TT.lp=setTimeout(()=>{ if(TT.mode==="pan"&&!TT.moved){ TT.mode="done"; if(navigator.vibrate) try{navigator.vibrate(18);}catch(e){} orderAt(TT.sx,TT.sy,true,false); } },450); }
  else if(ts.length>=2){ const [mx,my]=tmid(ts); Object.assign(TT,{mode:"pinch",d0:tdist(ts)||1,z0:cam.z,lx:mx,ly:my,moved:true}); } },{passive:false});
cv.addEventListener("touchmove",ev=>{ if(!G) return; ev.preventDefault(); const ts=ev.touches;
  if(TT.mode==="pan"&&ts.length===1){ const t=ts[0]; if(Math.abs(t.clientX-TT.sx)+Math.abs(t.clientY-TT.sy)>9){ TT.moved=true; clearTimeout(TT.lp); }
    if(TT.moved){ cam.x-=(t.clientX-TT.lx)/cam.z; cam.y-=(t.clientY-TT.ly)/cam.z; } TT.lx=t.clientX; TT.ly=t.clientY; }
  else if(TT.mode==="pinch"&&ts.length>=2){ const [mx,my]=tmid(ts); const [wx,wy]=toWorld(TT.lx,TT.ly); // world point under the previous midpoint
    const z=clamp(TT.z0*tdist(ts)/TT.d0,0.3,4.5); cam.z=cam.tz=z; cam.x=wx-(mx-CW/2)/z; cam.y=wy-(my-CH/2)/z; TT.lx=mx; TT.ly=my; } },{passive:false});
cv.addEventListener("touchend",ev=>{ if(!G) return; ev.preventDefault(); clearTimeout(TT.lp); TT.lp=null;
  if(ev.touches.length===1&&TT.mode==="pinch"){ const t=ev.touches[0]; Object.assign(TT,{mode:"pan",sx:t.clientX,sy:t.clientY,lx:t.clientX,ly:t.clientY,moved:true}); return; }
  if(ev.touches.length) return; const m=TT.mode; TT.mode=null; if(m!=="pan"||TT.moved) return;
  tapMap(TT.sx,TT.sy); },{passive:false});
cv.addEventListener("touchcancel",()=>{ clearTimeout(TT.lp); TT.mode=null; });
function tapMap(x,y){ if(G.over) return; const pid=provAtScreen(x,y), sel=selectedUnits().filter(u=>u.owner===0);
  if(sel.length&&pid>=0&&pid!==UI.sel){ orderAt(x,y,false,false); return; }           // units selected: tap = order
  if(sel.length&&pid===UI.sel){ UI.sel=null; UI.selUnits.clear(); renderPanel(true); return; } // tap the selection again = clear
  clickMap({clientX:x,clientY:y,shiftKey:false}); if(PHONE()&&UI.sel!=null){ sheetOpen(true); if(CH>CW&&y>CH*0.4){ UI.zoomAnchor=null; cam.y+=(y-CH*0.3)/cam.z; } } }
function clearSel(){ UI.sel=null; UI.selUnits.clear(); renderPanel(true); }
// order bar (phone + desktop touch): halt / clear / hint while units are selected
function updateOrderBar(){ const ob=$("obar"); if(!ob||!G) return; const sel=selectedUnits().filter(u=>u.owner===0); const on=sel.length>0&&!UI.modal&&(PHONE()||UI.touch);
  ob.style.display=on?"flex":"none"; if(on){ const t=`<b>${sel.length}</b> unit${sel.length>1?"s":""} selected · <span>tap destination to move · hold to queue</span>`; if(ob.dataset.t!==t){ ob.dataset.t=t; $("obtxt").innerHTML=t; } } }
$("ob-halt").addEventListener("click",()=>{ haltUnits(selectedUnits()); toast("Units halting","","■"); });
$("ob-clear").addEventListener("click",clearSel);
window.addEventListener("touchstart",()=>{ UI.touch=true; },{passive:true,capture:true});
// bottom sheet
function sheetOpen(o){ if(!PHONE()) return; UI.collapsed=!o; $("side").classList.toggle("col",!o); $("ticker").classList.toggle("wide",!o); }
$("grab").addEventListener("click",()=>sheetOpen(UI.collapsed)); 
$("tabs").addEventListener("click",()=>{ if(PHONE()) sheetOpen(true); });
$("ticker").addEventListener("click",()=>{ if(PHONE()) $("ticker").classList.toggle("open"); });
$("b-help").addEventListener("click",()=>showHelp());
function applyLayout(){ const ph=PHONE(); document.body.classList.toggle("phone",ph); if(ph&&!UI._phoneInit){ UI._phoneInit=true; sheetOpen(false); } }
window.addEventListener("resize",applyLayout); applyLayout();

/* =====================================================================
   SECTION 13 — SAVE / LOAD / BOOT
   Autosave to localStorage every AUTOSAVE_SEC real seconds + manual save.
   ===================================================================== */
function saveGame(silent){ if(!G) return; try{ localStorage.setItem(SAVE_KEY,JSON.stringify(G)); if(!silent){ log("Game saved.","good"); toast("War saved","good","💾"); } }catch(e){ if(!silent) toast("Save failed: "+e.message,"bad","✖"); } }
function loadGame(){ try{ const s=localStorage.getItem(SAVE_KEY); if(!s) return false; G=JSON.parse(s); if(G.v!==3) throw new Error("save from an older version"); rand=mulberry32((G.seed+Math.floor(G.time*7919))|0); postLoad(); log("Game loaded.","good"); setTab("prov"); setSpeed(0); return true; }
  catch(e){ alert("Could not load save: "+e.message); return false; } }
function boot(){ showStart(); requestAnimationFrame(frame); }
if(!window.__NO_BOOT) boot();
</script>
